services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dxrating
    ports:
      - '5432:5432'
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and rejects a
      # volume mounted directly at the legacy /var/lib/postgresql/data path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata: