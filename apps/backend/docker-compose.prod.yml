services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - database

  backend:
    image: ghcr.io/gekichumai/dxrating/backend@${BACKEND_IMAGE_DIGEST:?BACKEND_IMAGE_DIGEST is required}
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      IMAGE_DIGEST: ${BACKEND_IMAGE_DIGEST:?BACKEND_IMAGE_DIGEST is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      SUPER_ADMIN_USER_IDS: "${SUPER_ADMIN_USER_IDS:-[]}"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PUBLIC_ADDITIONAL_TRUSTED_ORIGINS: "${PUBLIC_ADDITIONAL_TRUSTED_ORIGINS:-[]}"
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:?ADMIN_FRONTEND_URL is required}
      ADMIN_ADDITIONAL_TRUSTED_ORIGINS: "${ADMIN_ADDITIONAL_TRUSTED_ORIGINS:-[]}"
      ADMIN_ACCESS_MODE: cloudflare
      ADMIN_ACCESS_ISSUER: ${ADMIN_ACCESS_ISSUER:?ADMIN_ACCESS_ISSUER is required}
      ADMIN_ACCESS_AUDIENCES: "${ADMIN_ACCESS_AUDIENCES:?ADMIN_ACCESS_AUDIENCES is required}"
      LEGACY_AUTH_COOKIE_DOMAIN: ${LEGACY_AUTH_COOKIE_DOMAIN:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      LXNS_CLIENT_ID: ${LXNS_CLIENT_ID:-}
      LXNS_CLIENT_SECRET: ${LXNS_CLIENT_SECRET:-}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      ASSETS_LOCAL_CACHE_DIR: ${ASSETS_LOCAL_CACHE_DIR:-}
      ASSETS_REMOTE_URL: ${ASSETS_REMOTE_URL:-}
      VAULT_SECRET_PATH: ${VAULT_SECRET_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', '--show-error', '--output', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - database
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.dxrating-backend.rule=PathPrefix(`/`)
      - traefik.http.routers.dxrating-backend.entrypoints=http
      - traefik.http.routers.dxrating-backend.priority=1
      - traefik.http.services.dxrating-backend.loadbalancer.server.port=3000
      - traefik.docker.network=coolify

networks:
  database:
    name: ${DATABASE_DOCKER_NETWORK:?DATABASE_DOCKER_NETWORK is required}
    external: true
  coolify:
    external: true

volumes:
  pgdata:
