services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dxrating']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/gekichumai/dxrating/backend:${BACKEND_IMAGE_TAG:-latest}
    expose:
      - '3000'
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM drains in-flight requests for up to 20s (DRAIN_TIMEOUT_MS), then closes the database pools and flushes
    # Sentry; Docker's default 10s would SIGKILL in the middle of that.
    stop_grace_period: 30s
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.dxrating-backend.rule=PathPrefix(`/`)
      - traefik.http.routers.dxrating-backend.entrypoints=http
      - traefik.http.routers.dxrating-backend.priority=1
      - traefik.http.services.dxrating-backend.loadbalancer.server.port=3000
      - traefik.docker.network=coolify

networks:
  coolify:
    external: true

volumes:
  pgdata: