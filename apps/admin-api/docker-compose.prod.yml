# Coolify service `dxrating-admin-api` (gekichumai/meta#50 L3). admin.dxrating.net's Worker forwards /api/* here.
services:
  admin-api:
    image: ghcr.io/gekichumai/dxrating/admin-api:${ADMIN_API_IMAGE_TAG:-latest}
    expose:
      - '3100'
    env_file:
      - .env.production
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.dxrating-admin-api.rule=Host(`admin-api.dxrating.net`)
      - traefik.http.routers.dxrating-admin-api.entrypoints=http
      - traefik.http.services.dxrating-admin-api.loadbalancer.server.port=3100
      - traefik.docker.network=coolify

networks:
  coolify:
    external: true
