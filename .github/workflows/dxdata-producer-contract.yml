name: DXData Producer Contract

on:
  workflow_call:
    inputs:
      consumer_ref:
        description: DXRating commit, branch, or tag to verify
        required: false
        default: main
        type: string
      producer_ref:
        description: Assembly-line commit, branch, or tag to verify
        required: false
        default: master
        type: string
permissions:
  contents: read

jobs:
  contract:
    name: Published Catalog Contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dxrating_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout DXRating consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gekichumai/dxrating
          ref: ${{ inputs.consumer_ref }}
          persist-credentials: false

      - name: Checkout dxdata assembly-line producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gekichumai/dxdata-assembly-line
          ref: ${{ inputs.producer_ref }}
          path: _producer/dxdata-assembly-line
          persist-credentials: false
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-11-07)
        with:
          toolchain: '1.99'

      - name: Cache producer build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '_producer/dxdata-assembly-line -> target'

      # Seed lindera's dictionary cache from the producer's vendored IPADIC, as
      # its own CI and Dockerfile do, so the build never downloads from
      # lindera.dev. Producer refs from before the archive was vendored skip it.
      - name: Seed the producer's IPADIC cache
        working-directory: _producer/dxdata-assembly-line
        run: |
          if [ ! -x scripts/seed-ipadic-cache.sh ]; then
            echo "::notice::Producer ref has no vendored IPADIC; lindera-ipadic may download it"
            exit 0
          fi
          sha256=$(sed -n 's/^ARG IPADIC_SHA256=//p' Dockerfile)
          format=$(sed -n 's/^ARG LINDERA_DICTIONARY_FORMAT_VERSION=//p' Dockerfile)
          test -n "$sha256" && test -n "$format"
          cache="$RUNNER_TEMP/lindera-cache"
          scripts/seed-ipadic-cache.sh vendor/ipadic/mecab-ipadic-2.7.0-20250920.tar.gz \
            "$sha256" "$cache" "$format"
          echo "LINDERA_BUILD_DICTIONARY_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          # Fail instead of quietly downloading if the seeded cache is missed.
          echo "0.0.0.0 lindera.dev" | sudo tee -a /etc/hosts

      - name: Install consumer dependencies
        run: pnpm install --frozen-lockfile

      - name: Build oneshot renderer
        run: pnpm --filter @gekichumai/oneshot-renderer build

      # The ignored producer integration test runs the real checksum-verified
      # migration ledger and its stage/promote publication path. No consumer
      # copy of the producer database schema or fixture is maintained here.
      - name: Apply producer migrations and publish executable fixture
        working-directory: _producer/dxdata-assembly-line
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dxrating_test
        run: >-
          cargo test --locked --test catalog_writer_tests
          publishes_the_real_sized_compatibility_catalog_transactionally
          -- --ignored --exact --test-threads=1

      - name: Verify producer-consumer API contract
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dxrating_test
          BETTER_AUTH_SECRET: ci_test_secret_1234567890
          BETTER_AUTH_URL: http://localhost:3001
          NODE_ENV: test
          PORT: 3001
        run: pnpm --filter @gekichumai/backend test:producer-contract
