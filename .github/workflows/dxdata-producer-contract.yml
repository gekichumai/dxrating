name: DXData Producer Contract

on:
  workflow_call:
    inputs:
      consumer_ref:
        description: DXRating commit, branch, or tag to verify
        required: false
        default: main
        type: string
      producer_ref:
        description: Assembly-line commit, branch, or tag to verify
        required: false
        default: master
        type: string
permissions:
  contents: read

jobs:
  contract:
    name: Published Catalog Contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dxrating_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout DXRating consumer
        uses: actions/checkout@v4
        with:
          repository: gekichumai/dxrating
          ref: ${{ inputs.consumer_ref }}
          persist-credentials: false

      - name: Checkout dxdata assembly-line producer
        uses: actions/checkout@v4
        with:
          repository: gekichumai/dxdata-assembly-line
          ref: ${{ inputs.producer_ref }}
          path: _producer/dxdata-assembly-line
          persist-credentials: false
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'

      - name: Cache producer build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: '_producer/dxdata-assembly-line -> target'

      - name: Install consumer dependencies
        run: pnpm install --frozen-lockfile

      # The dedicated producer command owns and applies its complete,
      # checksum-verified migration ledger. No consumer copy of the producer
      # database schema is maintained here.
      - name: Apply producer migrations
        working-directory: _producer/dxdata-assembly-line
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dxrating_test
        run: |
          cargo run --locked -- catalog-migrations apply
          cargo run --locked -- catalog-migrations check

      # The ignored producer integration test exercises the real
      # stage/promote publication path after the dedicated migration step.
      - name: Publish executable fixture
        working-directory: _producer/dxdata-assembly-line
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dxrating_test
        run: >-
          cargo test --locked --test catalog_writer_tests
          publishes_the_real_sized_compatibility_catalog_transactionally
          -- --ignored --exact --test-threads=1

      - name: Verify producer-consumer API contract
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dxrating_test
          BETTER_AUTH_SECRET: ci_test_secret_1234567890
          BETTER_AUTH_URL: http://localhost:3001
          ADMIN_ACCESS_MODE: test_bypass
          ADMIN_ACCESS_TEST_BYPASS_SECRET: ci-test-only-admin-access-proof-secret
          NODE_ENV: test
          PORT: 3001
        run: pnpm --filter @gekichumai/backend test:producer-contract
