name: 是什么歌.com CI

# The 是什么歌.com redirect Worker (apps/shishenmege). Pull requests run lint, tests and a dry-run build; pushes to main
# also deploy it, check the live redirect and roll back to the previous version if the check fails.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/shishenmege/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/shishenmege.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/shishenmege/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/shishenmege.yml'
  workflow_dispatch:

concurrency:
  group: shishenmege-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @gekichumai/shishenmege lint

      - name: Test
        run: pnpm --filter @gekichumai/shishenmege test

      - name: Build
        run: pnpm --filter @gekichumai/shishenmege build

  deploy:
    name: Deploy
    needs: [check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm --filter @gekichumai/shishenmege exec wrangler deploy --message "${GITHUB_SHA}"

      # The subdomain form is what existing links use; it must keep working
      - name: Check the live redirect
        run: |
          expected='https://dxrating.net/zh-hans?q=%E4%B8%80%E5%8F%B7%E5%BA%97&utm_source=shishenmege&utm_medium=redirect'
          for attempt in 1 2 3 4 5 6; do
            location=$(curl --silent --output /dev/null --max-time 10 --write-out '%{redirect_url}' \
              "https://xn--4gq48lf9j.xn--6iq3kq43dxve.com/?ci=${GITHUB_RUN_ID}-${attempt}")
            echo "attempt ${attempt}: ${location}"
            [ "$location" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error::The live redirect did not match ${expected}"
          exit 1

      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome == 'success'
        run: pnpm --filter @gekichumai/shishenmege exec wrangler rollback --yes --message "Live check failed for ${GITHUB_SHA}"
