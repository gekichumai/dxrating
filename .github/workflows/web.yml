name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Includes the i18n parity test: messages/*.json must match the i18next resources (pnpm i18n:convert)
      - name: Run web tests
        run: pnpm --filter @gekichumai/dxrating-web exec vitest run

  e2e:
    name: Web e2e (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A placeholder release turns the browser SDK on, as in deployed builds. There is no SENTRY_AUTH_TOKEN, so nothing
      # is uploaded; VITE_E2E_BUILD turns the Worker's Sentry off, and the tests stub the tunnel, so nothing is sent.
      - name: Build
        run: pnpm --filter @gekichumai/dxrating-web exec vite build
        timeout-minutes: 10
        env:
          SENTRY_RELEASE: dxrating@pr-0+0000000
          VITE_E2E_BUILD: '1'

      # The runner's preinstalled Google Chrome: `playwright install` hangs after the download on this Node version
      - name: Run Playwright
        run: pnpm --filter @gekichumai/dxrating-web exec playwright test
        timeout-minutes: 10
        env:
          E2E_EXPECT_SENTRY: '1'
          E2E_CHROMIUM_PATH: /usr/bin/google-chrome

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
