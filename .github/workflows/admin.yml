name: Admin CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'apps/admin-api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/admin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'apps/admin-api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-api:
    name: Admin API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @gekichumai/admin-api lint

      - name: Build
        run: pnpm --filter @gekichumai/admin-api build

      - name: Test
        run: pnpm --filter @gekichumai/admin-api test

  admin-app:
    name: Admin app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @gekichumai/admin lint

      - name: Build
        run: pnpm --filter @gekichumai/admin build

      - name: Test
        run: pnpm --filter @gekichumai/admin test
