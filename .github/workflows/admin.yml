name: Admin CI

on:
  push:
    branches:
      - main
      - feat/**
    paths:
      - 'apps/admin/**'
      - 'packages/admin-contract/**'
      - 'packages/api-contract/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.node-version'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/admin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/admin-contract/**'
      - 'packages/api-contract/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.node-version'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.github/workflows/admin.yml'
  workflow_dispatch:

concurrency:
  group: admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint administrator application
        run: pnpm --filter @gekichumai/admin lint

      - name: Type-check administrator application
        run: pnpm --filter @gekichumai/admin typecheck

      - name: Test administrator application
        run: pnpm --filter @gekichumai/admin test

      - name: Build production administrator application
        env:
          VITE_ADMIN_ENVIRONMENT: ci
          VITE_BACKEND_URL: https://admin-api.example.test
        run: pnpm turbo run build --filter=@gekichumai/admin...

      - name: Verify production SPA fallback
        shell: bash
        run: |
          set -euo pipefail

          preview_log="${RUNNER_TEMP}/admin-preview.log"
          root_document="${RUNNER_TEMP}/admin-root.html"
          nested_document="${RUNNER_TEMP}/admin-nested.html"

          pnpm --filter @gekichumai/admin preview --host 127.0.0.1 --port 4174 >"$preview_log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" >/dev/null 2>&1 || true
            wait "$preview_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..20}; do
            if curl --fail --silent --show-error \
              --header 'Accept: text/html' \
              --output "$root_document" \
              http://127.0.0.1:4174/; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" >/dev/null 2>&1; then
              cat "$preview_log" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 'true' ]]; then
            cat "$preview_log" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header 'Accept: text/html' \
            --output "$nested_document" \
            http://127.0.0.1:4174/chart-reports/00000000-0000-4000-8000-000000000001

          grep -F '<div id="root"></div>' "$root_document" >/dev/null
          cmp "$root_document" "$nested_document"
